/* checklist */
.cl{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 5px 0 var(--line)}
.cl .chat{padding:12px 4px 4px 0;max-height:min(360px,48vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.cl .item{flex:none}
.cl .item{align-self:flex-start;flex-direction:row-reverse}
.cl .bubble{border-radius:20px 20px 20px 6px}
.cl .empty{border:none;padding:12px 0 2px;background:none}
.ckcats{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
.ckcats button{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;color:var(--sub);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.ckcats button.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.ckcats button .n{font-size:.72rem;opacity:.8}
.ckcats button.add{border-style:dashed;padding:4px 10px}
.cl .bubble .cat{display:inline-block;font-size:.7rem;background:var(--pink-soft);color:var(--pinkd);border-radius:999px;padding:0 7px;margin-right:6px;vertical-align:1px}
.catrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow b{flex:1;font-weight:700}
.catrow .cnt{font-size:.8rem;color:var(--sub)}
.ckrow{display:flex;gap:8px}
.ckrow input{flex:1;min-width:0;border:2px solid var(--line);background:var(--field);border-radius:999px;padding:9px 16px}
.ckrow button{border:none;border-radius:999px;padding:0 18px;background:var(--pink);color:#fff;font-family:var(--head);box-shadow:0 3px 0 var(--pinkd)}
.bubble{border-radius:20px 20px 6px 20px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
/* ranking */
.rkfilters{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 16px}
.rkfilters button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;color:var(--sub);font-family:var(--head)}
.rkfilters button.on{border-color:var(--lav);background:var(--lav);color:#fff;box-shadow:0 3px 0 #7E62D9}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:14px}
.pd{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;box-shadow:0 5px 0 var(--line)}
.pd.p1{padding-top:18px;background:linear-gradient(180deg,#FFF3C4,var(--surface) 60%);border-color:#FFD36E;box-shadow:0 5px 0 #F2D27A}
.pd.p2{background:linear-gradient(180deg,#EEF1F8,var(--surface) 60%)}
.pd.p3{background:linear-gradient(180deg,#FFE6D6,var(--surface) 60%)}
:root[data-theme="dark"] .pd.p1,:root[data-theme="dark"] .pd.p2,:root[data-theme="dark"] .pd.p3{background:var(--surface)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pd.p1,:root:not([data-theme="light"]) .pd.p2,:root:not([data-theme="light"]) .pd.p3{background:var(--surface)}}
.pd .medal{font-size:1.6rem;line-height:1}
.pd .av,.rk .av{border-radius:16px;overflow:hidden;background:var(--pink-soft);color:var(--pinkd);display:grid;place-items:center;font-family:var(--head);flex:none;border:2px solid var(--surface);box-shadow:0 3px 0 var(--line)}
.pd .av{width:46px;height:46px}
.pd.p1 .av{width:60px;height:60px}
.pd .av img,.rk .av img{width:100%;height:100%;object-fit:cover}
.pd .nm{font-family:var(--head);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd .val{font-family:var(--head);font-size:1rem;color:var(--pinkd)}
.pd .ttl{font-size:.66rem;padding:2px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rk{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:8px 12px;margin-bottom:8px;box-shadow:0 4px 0 var(--line)}
.rk .no{font-family:var(--head);width:24px;text-align:center;color:var(--sub);font-size:1.05rem}
.rk .av{width:40px;height:40px;border-radius:14px}
.rk .info{flex:1;min-width:0}
.rk .info .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-family:var(--head)}
.rk .info .top b{font-weight:400}
.rk .info .ttl{font-size:.66rem;padding:1px 8px}
.rk .val{font-family:var(--head);text-align:right;color:var(--pinkd)}
.rk .val small{display:block;font-family:var(--body);font-weight:400;font-size:.7rem;color:var(--sub)}
.rk.me,.pd.me{outline:3px solid var(--pink);outline-offset:-1px}
.lvmini{font-family:var(--head);font-size:.72rem;color:#fff;background:#FF6FA8;border-radius:8px;padding:0 6px}
.member .av{border-radius:14px;background:var(--pink-soft);color:var(--pinkd)}
.alert{font-size:.9rem;border-color:#FFD36E;box-shadow:0 4px 0 #FFE7A8}
.alert b{font-family:var(--head);font-weight:400}
.goods .em,.order .em{border-radius:16px}
.minipack{border-radius:10px}

/* ===== pets ===== */
.petchips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.petchips button{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;font-family:var(--head);font-size:.9rem;color:var(--ink)}
.petchips button.on{border-color:var(--pink);box-shadow:0 3px 0 var(--pink-soft)}
.petchips .pi{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--pink-soft);display:grid;place-items:center;font-size:.9rem}
.petchips .pi img{width:100%;height:100%;object-fit:cover}
.petstage{position:relative;height:270px;border-radius:28px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 0 var(--line);background:linear-gradient(180deg,#BFE6FF 0%,#E8F6FF 58%,#B8E59E 58.5%,#98D67E 100%)}
.petstage.night{background:linear-gradient(180deg,#2C2A5E 0%,#5A4C8E 58%,#4E7A55 58.5%,#3C6544 100%)}
.petstage.eve{background:linear-gradient(180deg,#FFB79A 0%,#FFE0C2 58%,#A9D98C 58.5%,#8BC873 100%)}
:root[data-theme="dark"] .petstage{border-color:var(--line)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .petstage{border-color:var(--line)}}
.cloud{position:absolute;top:var(--t);left:-120px;width:90px;height:28px;border-radius:999px;background:rgba(255,255,255,.85);animation:cloud var(--dur) linear infinite;animation-delay:var(--d)}
.cloud::before{content:"";position:absolute;left:18px;top:-14px;width:40px;height:34px;border-radius:50%;background:inherit}
@keyframes cloud{to{transform:translateX(calc(100vw + 260px))}}
.petstage.night .cloud{background:rgba(255,255,255,.12)}
.sky-star{position:absolute;color:#FFF6C4;font-size:.7rem;animation:tw 2s var(--d) ease-in-out infinite}
.moon{position:absolute;right:26px;top:22px;width:34px;height:34px;border-radius:50%;box-shadow:-8px 4px 0 0 #FFF2B0}
.sun{position:absolute;right:28px;top:22px;width:40px;height:40px;border-radius:50%;background:#FFE27A;box-shadow:0 0 0 8px rgba(255,226,122,.35),0 0 30px rgba(255,200,80,.6)}
.tuft{position:absolute;bottom:var(--b);left:var(--x);width:14px;height:10px;border-radius:10px 10px 0 0;background:rgba(60,140,60,.35)}
.walker{position:absolute;bottom:34px;left:50%;width:130px;margin-left:-65px;animation:wander 18s ease-in-out infinite}
.walker.slow{animation-duration:34s}
@keyframes wander{0%,12%{transform:translateX(-95px)}40%,55%{transform:translateX(95px)}80%,100%{transform:translateX(-95px)}}
.facer{animation:face 18s steps(1) infinite}
.walker.slow .facer{animation-duration:34s}
@keyframes face{0%{transform:scaleX(1)}12%{transform:scaleX(-1)}55%{transform:scaleX(1)}}
.hopper{animation:hop .55s ease-in-out infinite alternate}
.walker.slow .hopper{animation:hop 1.4s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-8px)}}
.pimg{width:130px;height:130px;display:grid;place-items:center;font-size:4.5rem}
.pimg img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.pshadow{width:80px;height:12px;margin:-6px auto 0;border-radius:50%;background:rgba(0,0,0,.14);animation:shad .55s ease-in-out infinite alternate}
@keyframes shad{to{transform:scaleX(.8);opacity:.7}}
.psay{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:#fff;color:#3D3456;border-radius:16px;padding:6px 12px;font-size:.82rem;max-width:210px;width:max-content;box-shadow:0 3px 0 rgba(0,0,0,.08);text-align:center;line-height:1.35}
.psay::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.pemo{position:absolute;right:-6px;top:4px;font-size:1.3rem;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.fx-heart-pop{position:absolute;pointer-events:none;font-size:1.4rem;animation:hpop 1.2s ease-out forwards;left:var(--x);bottom:120px}
@keyframes hpop{0%{opacity:0;transform:translateY(0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-90px) scale(1.2)}}
.fx-drop{position:absolute;left:50%;top:-40px;font-size:2rem;animation:drop .9s cubic-bezier(.5,0,.8,.4) forwards;margin-left:-16px}
@keyframes drop{80%{opacity:1}100%{transform:translateY(190px);opacity:0}}
.pstats{display:grid;gap:8px;margin-top:14px}
.pst{display:grid;grid-template-columns:70px 1fr 42px;align-items:center;gap:8px;font-size:.85rem}
.pst .lb{font-family:var(--head)}
.pst .br{height:14px;border-radius:999px;background:var(--line);overflow:hidden}
.pst .br i{display:block;height:100%;border-radius:999px;background:var(--c)}
.pst .nv{text-align:right;color:var(--sub);font-size:.8rem}
.pmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pmeta span{font-size:.78rem;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:1px 10px}
.pmeta .tr{background:var(--pink-soft);border-color:transparent;color:var(--pinkd);font-weight:700}
.pacts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.pacts .btn{padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.88rem}
.pacts .btn .e{font-size:1.3rem;line-height:1}
.diary{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:0 5px 0 var(--line)}
.diary .dt{font-family:var(--head);font-size:1.05rem;display:flex;justify-content:space-between;gap:8px}
.diary .dt small{font-family:var(--body);font-size:.72rem;color:var(--sub);white-space:nowrap}
.diary p{margin:6px 0 0;font-size:.92rem;white-space:pre-wrap;word-break:break-word}
.diary .ln{margin-top:8px;display:inline-block;background:var(--pink-soft);color:var(--pinkd);border-radius:14px 14px 14px 4px;padding:4px 12px;font-size:.88rem;font-weight:700}
.diary.loading p{color:var(--sub)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.irow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:2px dashed var(--line)}
.irow:first-of-type{border-top:none}
.irow .ie{width:44px;height:44px;border-radius:14px;background:var(--field);display:grid;place-items:center;font-size:1.5rem;flex:none}
.irow .ii{flex:1;min-width:0}
.irow .ii b{font-family:var(--head);font-weight:400}
.irow .ii small{display:block;color:var(--sub);font-size:.76rem}
.irow .ie{overflow:hidden}
.irow .ie img{width:100%;height:100%;object-fit:cover;border-radius:12px}

/* ===== maps ===== */
.petstage{height:300px}
.petstage.custom{background-color:#cfe8ff}
.map-forest{background:linear-gradient(180deg,#9ED7B5 0%,#CFEFD9 55%,#6FB57A 55.5%,#4E9A5C 100%)}
.map-hunt{background:linear-gradient(180deg,#FFC6A0 0%,#FFE6C9 55%,#C9A27A 55.5%,#A88058 100%)}
.map-guild{background:linear-gradient(180deg,#F3D9B1 0%,#F7E6CA 60%,#C9935E 60.5%,#B07A47 100%)}
.map-market{background:linear-gradient(180deg,#BFE6FF 0%,#FFF1DA 55%,#E8C9A0 55.5%,#D9B386 100%)}
.map-ramen{background:linear-gradient(180deg,#FFE9C9 0%,#FFF4E2 60%,#B8574A 60.5%,#9A3F35 100%)}
.map-home{background:linear-gradient(180deg,#FFE3EE 0%,#FFF0F5 60%,#E9C29A 60.5%,#D7A97A 100%)}
.nightveil{position:absolute;inset:0;background:rgba(30,25,80,.38);pointer-events:none;z-index:1}
.petstage.custom.night .moon,.petstage.custom .sun{display:none}
.mapsign{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);color:#3D3456;border-radius:999px;padding:4px 14px;font-family:var(--head);font-size:.95rem;box-shadow:0 3px 0 rgba(0,0,0,.08);z-index:6;white-space:nowrap}
.maparrow{position:absolute;top:50%;margin-top:-22px;width:40px;height:44px;border:none;border-radius:16px;background:rgba(255,255,255,.88);color:#E0558F;font-size:1.8rem;line-height:1;font-family:var(--head);box-shadow:0 3px 0 rgba(0,0,0,.1);z-index:7;cursor:pointer}
.maparrow.l{left:8px} .maparrow.r{right:8px}
.maparrow:active{transform:translateY(2px)}
.mapdots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:6}
.mapdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6)}
.mapdots i.on{background:#fff;width:16px;border-radius:6px}
.nobody{position:absolute;left:0;right:0;bottom:70px;text-align:center;color:rgba(60,40,80,.55);font-family:var(--head);z-index:2}
.night .nobody{color:rgba(255,255,255,.7)}
.walker{bottom:calc(30px + var(--lane));background:none;border:none;padding:0;cursor:pointer;animation-delay:var(--wd);z-index:3}
.walker .facer,.walker .pshadow{display:block}
.walker .facer{animation-delay:var(--wd)}
.walker .hopper{display:block}
.walker .pimg{width:110px;height:110px;font-size:4rem}
.walker.sleep{animation:none;transform:translateX(0)}
.walker.sleep .facer{animation:none}
.walker.sleep .hopper{animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.03,.97)}}
.walker.sel .pimg{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 8px #FF7EB3)}
.ptag{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:rgba(255,255,255,.9);color:#3D3456;font-family:var(--head);font-size:.72rem;border-radius:999px;padding:0 8px;white-space:nowrap}
.walker.sel .ptag{background:#FF7EB3;color:#fff}
.walker .psay{bottom:128px;z-index:8}
.walker .psay.ask{background:#FFF3CF;border-color:#FFC94D;font-weight:700;animation:askBob 1.2s ease-in-out infinite}
@keyframes askBob{50%{transform:translateX(-50%) translateY(-4px)}}
/* 이벤트 카드 */
.fxo.k-event .fxo-pic{width:200px;height:260px;border-radius:18px;background:#fff;box-shadow:0 0 0 4px var(--fc),0 18px 40px rgba(0,0,0,.35);animation:evIn .9s cubic-bezier(.2,1.4,.4,1) both;overflow:hidden}
.fxo.k-event .fxo-pic img{width:100%;height:100%;object-fit:cover}
.fxo.k-event .fxo-pic .evemo{font-size:5rem}
.fxo.k-event .fxo-rays{background:repeating-conic-gradient(#FFD23F 0 4deg,transparent 4deg 9deg,#FF7EB3 9deg 13deg,transparent 13deg 18deg,#A98BFF 18deg 22deg,transparent 22deg 27deg);opacity:.7}
.fxo.k-event .fxo-sub{color:var(--ink);font-size:.95rem;line-height:1.5;max-width:300px;margin:8px auto 0;text-align:left;background:var(--field);border-radius:14px;padding:10px 12px}
@keyframes evIn{0%{transform:rotateY(90deg) scale(.6);opacity:0}60%{transform:rotateY(-12deg) scale(1.05);opacity:1}100%{transform:none}}
.evgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.evc{position:relative;border:none;background:var(--surface);border-radius:16px;padding:0 0 6px;box-shadow:0 4px 0 var(--line);text-align:center;overflow:hidden;color:var(--ink)}
.evc .pic{aspect-ratio:3/4;background:var(--field);display:grid;place-items:center;font-size:2.4rem;overflow:hidden}
.evc .pic img{width:100%;height:100%;object-fit:cover}
.evc .nm{font-size:.78rem;font-weight:700;padding:6px 6px 0;line-height:1.3}
.evc .cnt{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;font-size:.7rem;padding:1px 7px}
.evc.locked{opacity:.55}
.evc.locked .pic{filter:grayscale(1)}
.evc .tg{position:absolute;top:6px;left:6px;font-size:.68rem;background:var(--pink);color:#fff;border-radius:999px;padding:1px 7px}
.spfx .sp-ground{animation:none}
.spfx .sp-crack{display:none}
.rknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0 10px;font-family:var(--head)}
.wkt{width:100%;border-collapse:collapse;font-size:.85rem;min-width:280px}
.wkt th,.wkt td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.wkt th:first-child,.wkt td:first-child{text-align:left}
.wkt thead th{color:var(--sub);font-weight:400;font-size:.78rem}
.wkt tr.on td{background:var(--pink-soft);font-weight:700}
.wkt .lnk{border:none;background:none;color:var(--ink);font:inherit;padding:0;text-align:left;cursor:pointer}
.wkt .lnk small{display:block;color:var(--sub);font-size:.7rem;font-weight:400}
.chatbox{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px;margin-bottom:12px;box-shadow:0 5px 0 var(--line)}
.chatbox .ch-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--head);margin-bottom:6px}
.chatbox .ch-h small{font-family:var(--body);color:var(--sub);font-size:.75rem}
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;overscroll-behavior:contain;padding:4px 2px}
.chatlog .cm{max-width:82%;padding:7px 12px;border-radius:16px;font-size:.9rem;line-height:1.4;word-break:break-word}
.chatlog .cm.me{align-self:flex-end;background:#FEE500;color:#2B2B2B;border-bottom-right-radius:4px}
.chatlog .cm.pet{align-self:flex-start;background:var(--pink-soft);color:var(--ink);border-bottom-left-radius:4px}
.chatlog .cm.pet.wait{color:var(--sub);font-style:italic}
.chatlog .cm .tr,.psay .tr{display:block;color:var(--sub);font-size:.78rem;font-weight:400;margin-top:2px}
.chatlog .ct{font-size:.68rem;color:var(--sub);align-self:center;margin:2px 0}
.chatrow{display:flex;gap:8px;margin-top:8px}
.chatrow input{flex:1;min-width:0;border:2px solid var(--line);background:var(--field);border-radius:999px;padding:9px 14px}
.chatrow button{border:none;border-radius:999px;padding:0 16px;background:var(--pink);color:#fff;font-family:var(--head);box-shadow:0 3px 0 var(--pinkd)}
.chatrow button:disabled{opacity:.5}
.askbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--coin);border-radius:18px;padding:10px 12px;margin-bottom:10px;box-shadow:0 5px 0 var(--line)}
.askbar .ab-pic{width:42px;height:42px;border-radius:50%;overflow:hidden;background:var(--pb-t2);display:grid;place-items:center;font-size:1.4rem;flex:none}
.askbar .ab-pic img{width:100%;height:100%;object-fit:cover}
.askbar .ab-t{flex:1;min-width:0;font-size:.9rem}
.askbar .ab-t small{display:block;color:var(--sub);font-size:.75rem}
.walker.dance .mover{animation:dance .5s ease-in-out 4}
@keyframes dance{25%{transform:rotate(-12deg) translateY(-6px)}75%{transform:rotate(12deg) translateY(-6px)}}
.walker.yuck .mover{animation:yuck .35s ease-in-out 3}
@keyframes yuck{50%{transform:translateX(-8px)}}
.prefchips{display:flex;flex-wrap:wrap;gap:6px}
.prefchips label{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.82rem;cursor:pointer}
.prefchips input{width:auto;margin:0}
.prefchips label:has(input:checked){background:var(--pink-soft);border-color:var(--pink)}
.walker .pemo{z-index:4}
.tree{position:absolute;bottom:40%;left:var(--x);width:50px;height:90px;transform:scale(var(--s));transform-origin:bottom}
.tree::before{content:"";position:absolute;bottom:0;left:21px;width:8px;height:30px;background:#8A5A3B;border-radius:3px}
.tree::after{content:"";position:absolute;bottom:22px;left:0;width:50px;height:70px;border-radius:50% 50% 45% 45%;background:#4FA067;box-shadow:inset -6px -6px 0 rgba(0,0,0,.08)}
.awning{position:absolute;top:0;left:0;right:0;height:34px;background:repeating-linear-gradient(90deg,#FF8FB1 0 26px,#fff 26px 52px);border-radius:0 0 18px 18px}
.stall{position:absolute;bottom:44%;left:var(--x);background:#fff;border-radius:12px;padding:4px 10px;font-size:1.2rem;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.noren{position:absolute;top:0;left:15%;right:15%;height:60px;display:flex;gap:4px}
.noren i{flex:1;background:#2E3A6E;border-radius:0 0 6px 6px}
.steam{position:absolute;right:16%;bottom:44%;font-size:1.6rem;animation:bob 2s ease-in-out infinite}
.board{position:absolute;top:40px;left:50%;margin-left:-80px;width:160px;height:80px;background:#A87447;border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.board i{background:#FFF6E2;border-radius:3px}
.rock{position:absolute;bottom:38%;left:var(--x);width:60px;height:36px;border-radius:50% 50% 40% 40%;background:#9C8A7C;transform:scale(var(--s,1));transform-origin:bottom}
.window{position:absolute;top:30px;left:16%;width:70px;height:56px;border-radius:10px;background:#CDEBFF;border:5px solid #fff;display:grid;place-items:center;font-size:1.3rem}
.bed{position:absolute;bottom:34%;right:12%;width:90px;height:34px;border-radius:12px;background:#FFB3D4;box-shadow:inset 0 8px 0 #fff}
.findhint{text-align:center;color:var(--sub);font-size:.9rem;padding:14px 8px 4px}
.findhint small{display:block;margin-top:4px}
.ppanel{margin-top:14px}
.pacts.four{grid-template-columns:repeat(4,1fr)}
.pacts.four .btn{font-size:.82rem}
.aibar{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px 14px;margin-top:16px;box-shadow:0 5px 0 var(--line)}
.aibar > div{flex:1;min-width:0}
.aibar b{font-family:var(--head);font-weight:400;font-size:1.02rem;display:block}
.aibar small{color:var(--sub);font-size:.76rem}
.diary.tog{border-color:#BFD9FF;box-shadow:0 5px 0 #DCEBFF}
.dtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dtags span{font-size:.72rem;color:var(--sub);background:var(--field);border-radius:999px;padding:0 8px}
.dtags .w{background:#DCEBFF;color:#2F6DB5}

/* ===== result overlays ===== */
.fxo{position:fixed;inset:0;z-index:45;display:grid;place-items:center;padding:20px;overflow:hidden}
.fxo-bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.25),rgba(40,20,60,.82) 70%);animation:fxin .3s ease-out}
.fxo.k-fail .fxo-bg{background:radial-gradient(circle at 50% 45%,rgba(120,140,180,.35),rgba(15,20,40,.9) 70%)}
@keyframes fxin{from{opacity:0}}
.fxo-rays{position:absolute;left:50%;top:45%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(var(--fc) 0 6deg,transparent 6deg 16deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 55%);mask:radial-gradient(circle,#000 0,transparent 55%);opacity:.5;animation:rspin 16s linear infinite,fxin .6s ease-out}
.fxo.k-lv .fxo-rays,.fxo.k-clear .fxo-rays{background:repeating-conic-gradient(#ff7eb3 0 5deg,transparent 5deg 10deg,#ffd23f 10deg 15deg,transparent 15deg 20deg,#7cc4ff 20deg 25deg,transparent 25deg 30deg,#a98bff 30deg 35deg,transparent 35deg 40deg);opacity:.6}
.fxo.k-fail .fxo-rays{display:none}
.fxo-ring{position:absolute;left:50%;top:45%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid var(--fc);opacity:0;animation:shock 1.2s var(--d) cubic-bezier(.1,.7,.3,1) forwards;--s:16}
.fxo .cf{top:45%;animation:cf 1.6s var(--d) cubic-bezier(.1,.8,.3,1) forwards}
.fxo-rain i{position:absolute;top:-20px;left:var(--x);width:2px;height:18px;background:rgba(180,200,255,.6);border-radius:2px;animation:rainl var(--dur) var(--d) linear infinite}
@keyframes rainl{to{transform:translateY(110vh)}}
.fxo-box{position:relative;width:min(340px,100%);background:var(--surface);border-radius:30px;padding:26px 20px 20px;text-align:center;box-shadow:0 8px 0 var(--line),0 20px 50px rgba(0,0,0,.35);animation:boxpop .6s cubic-bezier(.2,1.6,.4,1);border:3px solid #fff}
:root[data-theme="dark"] .fxo-box{border-color:var(--line)} @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fxo-box{border-color:var(--line)}}
@keyframes boxpop{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.fxo-title{position:absolute;left:0;right:0;top:-34px;font-family:var(--head);font-size:2.3rem;line-height:1;color:#fff;-webkit-text-stroke:2px var(--fd);text-shadow:0 5px 0 var(--fd),0 0 24px var(--fc);animation:slam .7s .15s cubic-bezier(.2,1.8,.4,1) both}
.fxo.k-fail .fxo-title{animation:slam .7s .15s cubic-bezier(.2,1.8,.4,1) both,shakeX .5s .9s}
@keyframes shakeX{20%,60%{transform:translateX(-8px) rotate(-3deg)}40%,80%{transform:translateX(8px) rotate(3deg)}}
.fxo-pic{width:110px;height:110px;margin:14px auto 8px;border-radius:28px;background:var(--field);display:grid;place-items:center;font-size:3.6rem;overflow:hidden;box-shadow:0 0 0 4px var(--fc),0 0 30px var(--fc);animation:picbounce 1.4s .5s ease-in-out infinite}
.fxo-pic img{width:100%;height:100%;object-fit:cover}
.fxo.k-pet .fxo-pic img,.fxo.k-lv .fxo-pic img{object-fit:contain}
.fxo.k-fail .fxo-pic{animation:none;filter:grayscale(.4)}
@keyframes picbounce{50%{transform:translateY(-6px) scale(1.04)}}
.fxo-name{font-family:var(--head);font-size:1.3rem}
.fxo-sub{color:var(--sub);font-size:.9rem;margin-top:4px;white-space:pre-wrap}
.fxo-big{font-family:var(--head);font-size:1.8rem;margin-top:6px;background:linear-gradient(90deg,#FF7EB3,#A98BFF,#7CC4FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.fxo-rw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.fxo-rw > span:not(.ttl){font-size:.85rem;font-weight:700;border-radius:12px;padding:3px 10px;background:var(--pink-soft);color:var(--pinkd)}
.fxo-rw > span{opacity:0;animation:rwin .4s var(--d) ease-out forwards}
@keyframes rwin{from{opacity:0;transform:translateY(10px) scale(.8)}to{opacity:1;transform:none}}
.fxo .btn{margin-top:16px}
/* stage interaction fx */
.sfx-ring{position:absolute;left:var(--x);top:var(--y);width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:5px solid var(--c);z-index:9;pointer-events:none;animation:shock .9s cubic-bezier(.1,.7,.3,1) forwards;--s:9}
.sfx-p{position:absolute;left:var(--x);top:var(--y);font-size:1.5rem;z-index:9;pointer-events:none;animation:sfxp 1.1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes sfxp{0%{transform:translate(-50%,-50%) scale(.3);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2);opacity:0}}
.sfx-flash{position:absolute;inset:0;background:var(--c);opacity:0;z-index:8;pointer-events:none;animation:flash .6s ease-out}
.walker.jump .hopper{animation:jumpy .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes jumpy{30%{transform:translateY(-40px) scale(1.15,.9)}60%{transform:translateY(0) scale(.9,1.1)}}
.lockchip{background:#E3E7FF!important;color:#4B5BD6!important;border-color:transparent!important;font-weight:700}
/* growth album */
.galb{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 5px 0 var(--line)}
.galb .gh{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}
.galb .gh::-webkit-details-marker{display:none}
.galb .gh>div:nth-child(2){flex:1;min-width:0}
.gchev{flex:none;display:flex;align-items:center;gap:4px;font-size:.75rem;color:var(--sub);white-space:nowrap}
.gchev i{font-style:normal;font-size:1rem;transition:transform .2s}
.galb[open] .gchev i{transform:rotate(180deg)}
.galb:not([open]){padding-bottom:14px}
.galb .gp{width:64px;height:64px;border-radius:20px;background:var(--pink-soft);display:grid;place-items:center;font-size:2rem;overflow:hidden;flex:none}
.galb .gp img{width:100%;height:100%;object-fit:contain}
.galb .gn{font-family:var(--head);font-size:1.2rem}
.tl{margin:12px 0 0;padding:0 0 0 18px;list-style:none;position:relative}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:3px;border-radius:3px;background:var(--line)}
.tl li{position:relative;padding:4px 0 8px;font-size:.88rem}
.tl li::before{content:"";position:absolute;left:-17px;top:9px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--pink));box-shadow:0 0 0 3px var(--surface)}
.tl li small{display:block;color:var(--sub);font-size:.72rem}
.tl li p{margin:4px 0 0;color:var(--sub);font-size:.84rem;white-space:pre-wrap}

/* ===== gacha: extra spectacle ===== */
.gx .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.5);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.gx-sky{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 8% 18%,#fff,transparent),radial-gradient(1px 1px at 22% 70%,#fff,transparent),radial-gradient(2px 2px at 35% 32%,#fff,transparent),radial-gradient(1px 1px at 52% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 58%,#fff,transparent),radial-gradient(1px 1px at 78% 26%,#fff,transparent),radial-gradient(2px 2px at 90% 76%,#fff,transparent),radial-gradient(1px 1px at 14% 88%,#fff,transparent),radial-gradient(1.5px 1.5px at 60% 86%,#fff,transparent);animation:twk 2.6s ease-in-out infinite alternate}
@keyframes twk{from{opacity:.3}to{opacity:.9}}
.orbit{position:absolute;left:50%;top:42%;width:300px;height:300px;margin:-150px 0 0 -150px;pointer-events:none;animation:rspin 5s linear infinite;transition:opacity .4s}
.orbit i{position:absolute;left:146px;top:0;width:8px;height:8px;border-radius:50%;background:var(--rc);box-shadow:0 0 10px 2px var(--rc);transform-origin:4px 150px;transform:rotate(var(--a))}
.t-charge .orbit{animation-duration:.8s}
.t-burst .orbit{opacity:0}
.beam{position:absolute;left:var(--x);bottom:-10%;width:var(--w);height:130%;background:linear-gradient(0deg,transparent 0%,var(--c) 45%,#fff 55%,transparent 100%);opacity:0;filter:blur(1px);transform-origin:bottom center;transform:rotate(var(--k)) scaleY(0);pointer-events:none;mix-blend-mode:screen}
.t-burst .beam{animation:beam 1.5s var(--d) ease-out forwards}
.gx[data-r="legendary"].t-reveal .beam{animation:beamLoop 2.2s var(--d) ease-in-out infinite}
@keyframes beam{0%{opacity:0;transform:rotate(var(--k)) scaleY(0)}25%{opacity:.85;transform:rotate(var(--k)) scaleY(1)}100%{opacity:0;transform:rotate(var(--k)) scaleY(1)}}
@keyframes beamLoop{0%,100%{opacity:.15;transform:rotate(var(--k)) scaleY(1)}50%{opacity:.7;transform:rotate(var(--k)) scaleY(1)}}
.fw{position:absolute;left:var(--x);top:var(--y);pointer-events:none}
.fw i{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--c);box-shadow:0 0 8px 2px var(--c);opacity:0}
.t-reveal .fw i{animation:fwb 1.8s var(--d) cubic-bezier(.1,.8,.3,1) infinite}
@keyframes fwb{0%{opacity:0;transform:translate(0,0) scale(1.4)}5%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 30px)) scale(.3)}}
.bolt{position:absolute;top:0;left:var(--x);width:46px;height:62%;opacity:0;pointer-events:none;filter:drop-shadow(0 0 6px var(--rc)) drop-shadow(0 0 14px #fff)}
.t-charge .bolt{animation:boltf .6s var(--d) steps(1) infinite}
.t-burst .bolt{animation:boltf .3s steps(1) 3}
@keyframes boltf{0%{opacity:1}20%{opacity:0}45%{opacity:1}55%{opacity:0}100%{opacity:0}}
.wave{position:absolute;left:50%;top:42%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;opacity:0;pointer-events:none;background:conic-gradient(#ff5f6d,#ffd23f,#5cf08a,#4fc3ff,#b48bff,#ff5f6d);-webkit-mask:radial-gradient(circle,transparent 55%,#000 58%,#000 68%,transparent 72%);mask:radial-gradient(circle,transparent 55%,#000 58%,#000 68%,transparent 72%)}
.t-burst .wave{animation:wavex 1.5s var(--d) ease-out forwards}
@keyframes wavex{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(80)}}
.fount{position:absolute;left:50%;top:60%;pointer-events:none}
.fount i{position:absolute;font-style:normal;font-size:var(--fs);color:var(--c);text-shadow:0 0 8px var(--c);opacity:0}
.t-reveal .fount i{animation:fount var(--dur) var(--d) cubic-bezier(.2,.6,.4,1) infinite}
@keyframes fount{0%{opacity:1;transform:translate(0,0) rotate(0)}45%{opacity:1;transform:translate(calc(var(--dx)*.55),var(--h)) rotate(180deg)}100%{opacity:0;transform:translate(var(--dx),260px) rotate(400deg)}}
.gx.t-burst:not([data-r="epic"]):not([data-r="legendary"]) .gx-stage{animation:punch .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes punch{30%{transform:scale(1.08)}60%{transform:scale(.97)}}
.gcard .inner{transition:transform var(--spd,1s) .4s cubic-bezier(.2,.9,.3,1)}
.t-reveal .gcard .inner{transform:rotateY(var(--spin,180deg))}
.gcard .front::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.85) 50%,transparent 65%);background-size:250% 100%;background-position:150% 0;opacity:0}
.t-reveal .gcard .front::before{animation:cshine 1.2s 1.3s ease-out forwards}
@keyframes cshine{0%{opacity:1;background-position:150% 0}100%{opacity:1;background-position:-80% 0}}
.gx[data-x="ex"].t-slam .slam{text-shadow:-4px 0 0 rgba(255,0,90,.8),4px 0 0 rgba(0,200,255,.8);animation:slam .75s cubic-bezier(.2,1.8,.4,1) forwards,rb 1.2s linear infinite,glitch .25s steps(2) 3 .75s}
@keyframes glitch{50%{transform:translate(-4px,2px) skewX(-8deg)}}
.gx[data-x="ex"].t-burst .gx-bg{animation:exbg 1.6s ease-in-out infinite alternate}
@keyframes exbg{to{filter:hue-rotate(80deg) brightness(1.2)}}

.askov{position:fixed;inset:0;z-index:60;background:rgba(30,20,50,.45);display:grid;place-items:center;padding:24px;animation:fxin .2s}
.askbox{width:min(320px,100%);background:var(--surface);border-radius:26px;padding:22px 20px 18px;text-align:center;box-shadow:0 6px 0 var(--line),0 20px 40px rgba(0,0,0,.25);animation:boxpop .35s cubic-bezier(.2,1.6,.4,1)}
.askic{font-size:2rem}
.askbox p{margin:8px 0 16px;font-size:1rem;line-height:1.5;word-break:keep-all}
.askbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ===== pet games ===== */
.acorn{font-family:var(--head);font-size:.95rem;background:#FFF0D6;color:#8A5300;border-radius:999px;padding:2px 10px;box-shadow:0 2px 0 #F2D27A}
.actcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:12px 14px;margin-top:14px;box-shadow:0 5px 0 var(--line)}
.acthead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.acthead b{font-family:var(--head);font-weight:400;font-size:1.02rem}
.actbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--line);background:var(--field);border-radius:18px;padding:10px 12px;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.actbtn:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.actbtn:disabled{opacity:.5}
.actbtn .ai{font-size:1.8rem;width:46px;height:46px;border-radius:14px;background:var(--surface);display:grid;place-items:center;flex:none}
.actbtn b{font-family:var(--head);font-weight:400;font-size:1.05rem;display:block}
.actbtn small{color:var(--sub);font-size:.78rem}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed var(--line)}
.mission:first-of-type{border-top:none}
.mission .mi{font-size:1.3rem}
.mission .mt{flex:1;min-width:0}
.mission .mt b{font-family:var(--head);font-weight:400}
.mission .mt small{color:var(--sub);font-size:.75rem}
.mp{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin:3px 0}
.mp i{display:block;height:100%;background:linear-gradient(90deg,#4FCFA8,#7CC4FF)}
.mission.got{opacity:.55}
.mission.bonus{background:var(--pink-soft);border-radius:14px;padding:8px 10px;border-top:none;margin-top:6px}
.gm{position:fixed;inset:0;z-index:44;background:rgba(30,20,50,.6);display:grid;place-items:center;padding:16px;animation:fxin .2s}
.gmbox{width:min(400px,100%);background:var(--surface);border-radius:28px;padding:14px 16px 18px;box-shadow:0 8px 0 var(--line),0 20px 50px rgba(0,0,0,.3);animation:boxpop .45s cubic-bezier(.2,1.6,.4,1)}
.gmtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gmtop b{font-family:var(--head);font-weight:400;font-size:1.3rem}
.gmx{border:none;background:var(--field);border-radius:12px;width:36px;height:36px;font-size:1rem;color:var(--sub)}
.gmhud{display:flex;justify-content:space-between;font-family:var(--head);margin-bottom:6px}
#wScore{display:inline-block}
#wScore.bump{animation:pop .3s cubic-bezier(.2,1.8,.4,1)}
.gmbar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:10px}
.gmbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF7EB3,#FFC94D)}
.weedfield{position:relative;height:320px;border-radius:22px;overflow:hidden;background:radial-gradient(circle at 30% 30%,#C8EFA8,#8DCE6B 70%);touch-action:manipulation;user-select:none}
.gmcount{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:3.4rem;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.2);animation:pop .4s}
.weed{position:absolute;border:none;background:none;font-size:2.4rem;padding:4px;transform:translate(-50%,-50%);animation:sprout .25s cubic-bezier(.2,1.8,.4,1);cursor:pointer}
.weed.gold{filter:drop-shadow(0 0 8px #FFD23F)}
.weed.pulled{animation:yank .35s ease-in forwards}
.weed.gone{animation:yank .25s reverse forwards;opacity:.3}
@keyframes sprout{from{transform:translate(-50%,-10%) scale(.2)}}
@keyframes yank{to{transform:translate(-50%,-160%) rotate(40deg) scale(1.3);opacity:0}}
.hunt .hrow{display:flex;align-items:center;justify-content:space-around;margin:6px 0 14px}
.fighter{text-align:center;position:relative}
.fighter .fpic{width:96px;height:96px;display:grid;place-items:center;font-size:3.6rem;border-radius:26px;background:var(--field);overflow:hidden}
.fighter .fpic img{width:100%;height:100%;object-fit:contain}
.fighter.mon .fpic{background:#FFE3E3;animation:bob 1.2s ease-in-out infinite}
.fighter .hp{font-size:.9rem;margin-top:4px;letter-spacing:-2px}
.fighter small{font-family:var(--head);font-size:.85rem}
.fighter.hit .fpic{animation:hitshake .45s}
@keyframes hitshake{20%{transform:translateX(-8px) rotate(-6deg);filter:brightness(1.8)}40%{transform:translateX(8px) rotate(6deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.dmg{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-family:var(--head);font-size:1.2rem;color:#FF4D7A;text-shadow:0 2px 0 #fff;animation:dmgup .8s ease-out forwards;white-space:nowrap}
@keyframes dmgup{to{transform:translate(-50%,-40px);opacity:0}}
.vs{font-family:var(--head);font-size:1.6rem;color:#FF7EB3}
.tbar{position:relative;height:30px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0}
.tbar .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#4FCFA8,#8FF0CF);border-radius:8px;transition:left .3s}
.tbar .needle{position:absolute;top:-2px;bottom:-2px;width:6px;margin-left:-3px;background:#3D3456;border-radius:4px;box-shadow:0 0 0 2px #fff}
.bushes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bush{aspect-ratio:1;border:none;border-radius:24px;background:radial-gradient(circle at 40% 30%,#C8EFA8,#7BC260);font-size:3rem;box-shadow:0 5px 0 #5E9E48;animation:rustle 1.6s ease-in-out infinite}
.bush:nth-child(2){animation-delay:.3s}.bush:nth-child(3){animation-delay:.6s}
@keyframes rustle{50%{transform:rotate(3deg) scale(1.03)}}
.bush.open{animation:pop .5s cubic-bezier(.2,1.8,.4,1);background:radial-gradient(circle,#FFF6C4,#FFE08A);box-shadow:0 5px 0 #E8C24A}
.bush.dim{opacity:.4;animation:none}

/* ===== walk & action animations ===== */
.walker{animation:none!important;transform:none;width:110px;margin-left:-55px}
.mover{position:relative;display:block;width:110px;height:110px;animation:wpos var(--cyc,22s) linear infinite;animation-delay:var(--wd)}
.walker.slow .mover{--cyc:40s}
@keyframes wpos{0%{transform:translateX(-95px)}25%{transform:translateX(95px)}50%{transform:translateX(95px)}75%{transform:translateX(-95px)}100%{transform:translateX(-95px)}}
.lay{position:absolute;inset:0;display:grid;place-items:center;font-size:4rem;animation-duration:var(--cyc,22s);animation-iteration-count:infinite;animation-timing-function:linear;animation-delay:var(--wd)}
.walker.slow .lay{--cyc:40s}
.lay img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08))}
.lay.wr{animation-name:showWR} .lay.wl{animation-name:showWL} .lay.act{animation-name:showACT}
@keyframes showWR{0%,24.6%{opacity:1}25%,100%{opacity:0}}
@keyframes showWL{0%,49.6%{opacity:0}50%,74.6%{opacity:1}75%,100%{opacity:0}}
@keyframes showACT{0%,24.6%{opacity:0}25%,49.6%{opacity:1}50%,74.6%{opacity:0}75%,100%{opacity:1}}
.flip{transform:scaleX(-1)}
.waddle{display:grid;place-items:center;width:100%;height:100%;animation:waddle .42s ease-in-out infinite alternate;transform-origin:50% 90%}
.walker.slow .waddle{animation-duration:.9s}
@keyframes waddle{0%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(0) translateY(-7px)}100%{transform:rotate(7deg) translateY(0)}}
.pb{display:grid;place-items:center;width:100%;height:100%;transform-origin:50% 90%}
.prop{position:absolute;font-style:normal;pointer-events:none;line-height:1}
/* field: weeding */
.act-field .pb{animation:pull 1.1s ease-in-out infinite}
@keyframes pull{0%,100%{transform:none}35%{transform:translateY(10px) scale(1.06,.88) rotate(4deg)}55%{transform:translateY(-8px) scale(.96,1.06) rotate(-4deg)}}
.act-field .pf{left:62%;bottom:4%;font-size:1.6rem;animation:weedfly 1.1s ease-in-out infinite}
@keyframes weedfly{0%,40%{transform:none;opacity:1}75%{transform:translate(26px,-58px) rotate(160deg);opacity:1}100%{transform:translate(40px,-20px) rotate(300deg);opacity:0}}
/* guild: reading the board */
.act-guild .pb{animation:lookup 1.8s ease-in-out infinite alternate}
@keyframes lookup{from{transform:rotate(-4deg) translateY(0)}to{transform:rotate(-10deg) translateY(-4px)}}
.act-guild .pg1{left:-34%;top:-6%;font-size:2.6rem}
.act-guild .pg2,.act-guild .pg3{right:-8%;top:-14%;font-size:1.4rem;animation:qmark 3.6s steps(1) infinite}
.act-guild .pg3{animation-delay:-1.8s}
@keyframes qmark{0%{opacity:1;transform:scale(1)}50%{opacity:0}}
/* forest: sniffing */
.act-forest .pb{animation:sniff .8s ease-in-out infinite alternate}
@keyframes sniff{from{transform:translateX(-5px) rotate(-5deg)}to{transform:translateX(5px) rotate(5deg)}}
.act-forest .pfo1{left:10%;top:-10%;font-size:1.3rem;animation:leaf 2.2s linear infinite}
.act-forest .pfo2{right:-6%;bottom:2%;font-size:1.5rem;animation:bob 1.6s ease-in-out infinite}
@keyframes leaf{0%{transform:translate(0,-10px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(30px,90px) rotate(240deg);opacity:0}}
/* hunt: swinging */
.act-hunt .pb{animation:jab .7s ease-in-out infinite}
@keyframes jab{0%,100%{transform:none}40%{transform:translateX(12px) rotate(8deg)}55%{transform:translateX(-4px)}}
.act-hunt .ph1{right:-14%;top:20%;font-size:1.8rem;transform-origin:0% 100%;animation:swing .7s ease-in-out infinite}
.act-hunt .ph2{right:-30%;top:4%;font-size:1.4rem;animation:boom .7s steps(1) infinite}
@keyframes swing{0%,100%{transform:rotate(-40deg)}45%{transform:rotate(50deg)}}
@keyframes boom{0%,40%{opacity:0}45%,70%{opacity:1}}
/* market: browsing */
.act-market .pb{animation:browse 1.6s ease-in-out infinite}
@keyframes browse{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.act-market .pm1{right:-10%;bottom:6%;font-size:1.7rem;animation:bob 1.2s ease-in-out infinite}
.act-market .pm2{left:4%;top:-6%;font-size:1.1rem;animation:tw 1.4s ease-in-out infinite}
/* ramen: slurping */
.act-ramen .pb{animation:slurp .5s ease-in-out infinite alternate}
@keyframes slurp{to{transform:translateY(6px) scale(1.03,.95)}}
.act-ramen .pr1{left:50%;bottom:-4%;margin-left:-.8em;font-size:1.9rem}
.act-ramen .pr2{left:56%;bottom:24%;font-size:1.1rem;animation:steamup 1.6s ease-out infinite}
@keyframes steamup{0%{transform:translateY(0);opacity:0}30%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
/* home: humming */
.act-home .pb{animation:rock 1.3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.act-home .pho{right:-6%;top:-6%;font-size:1.2rem;animation:steamup 1.8s ease-out infinite}
.act.custom .prop{display:none}
.walker.sleep .mover{animation:none;transform:none}
.walker.sleep .lay{animation:none;opacity:0}
.walker.sleep .lay.sl{opacity:1}
.lay.sl{display:none}
.walker.sleep .lay.sl{display:grid;animation:breath 2.4s ease-in-out infinite}
.walker .pshadow{position:absolute;left:50%;bottom:-4px;margin-left:-40px}
.walker .ptag{bottom:-14px}
.walker .pemo{right:-4px;top:-2px}
.walker.sel .mover{filter:drop-shadow(0 0 6px #FF7EB3) drop-shadow(0 0 2px #fff)}
.walker .psay{bottom:122px}
.walker.jump .lay > span{animation:jumpy .7s cubic-bezier(.3,1.6,.5,1)!important}
.animgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aslot{border:2px dashed var(--line);border-radius:18px;padding:8px;text-align:center;font-size:.78rem;position:relative}
.aslot .th{height:70px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:4px}
.aslot .th img{max-width:100%;max-height:100%;object-fit:contain}
.aslot b{display:block;font-family:var(--head);font-weight:400;font-size:.85rem}
.aslot .ab{display:flex;gap:4px;justify-content:center;margin-top:6px}
.aslot .ab label,.aslot .ab button{font-size:.72rem;padding:3px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.aslot.on{border-style:solid;border-color:var(--pink)}
.mtag{font-size:.65rem;border-radius:6px;padding:0 6px;margin-left:4px;font-family:var(--body);vertical-align:2px}
.mtag.pet{background:var(--pink-soft);color:var(--pinkd)}
.mtag.life{background:#DCEBFF;color:#2F6DB5}

/* ===== premium card pack ===== */
.pack{width:210px;height:304px;filter:drop-shadow(0 22px 26px rgba(0,0,0,.55))}
.pack .top,.pack .body{background:none;animation:none;clip-path:none}
.pack .top{height:46px;border-bottom:none;border-radius:6px 6px 0 0;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 35%,#fff),color-mix(in srgb,var(--pc) 70%,#2a1640));
  -webkit-mask:radial-gradient(circle at 4px 0,transparent 3.6px,#000 4px) 0 0/8px 7px repeat-x,linear-gradient(#000,#000) 0 7px/100% 100% no-repeat;
  mask:radial-gradient(circle at 4px 0,transparent 3.6px,#000 4px) 0 0/8px 7px repeat-x,linear-gradient(#000,#000) 0 7px/100% 100% no-repeat;
  color:rgba(255,255,255,.95);font-size:.66rem;letter-spacing:.12em;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pack .top::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 1px,transparent 1px 4px);opacity:.6}
.pack .top::after{content:"";position:absolute;left:8px;right:8px;bottom:3px;border-bottom:2px dashed rgba(255,255,255,.85)}
.pack .top span{position:relative;z-index:1}
.pack .body{top:46px;bottom:0;padding:0;overflow:hidden;border-radius:0 0 6px 6px;justify-content:flex-start;gap:0;
  background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--pc) 45%,#fff) 0%,var(--pc) 42%,color-mix(in srgb,var(--pc) 50%,#1b0d33) 100%);
  -webkit-mask:linear-gradient(#000,#000) 0 0/100% calc(100% - 7px) no-repeat,radial-gradient(circle at 4px 100%,transparent 3.6px,#000 4px) 0 100%/8px 7px repeat-x;
  mask:linear-gradient(#000,#000) 0 0/100% calc(100% - 7px) no-repeat,radial-gradient(circle at 4px 100%,transparent 3.6px,#000 4px) 0 100%/8px 7px repeat-x}
.pack .art{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.35) 1px,transparent 1.3px),radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.3px);background-size:14px 14px,14px 14px;background-position:0 0,7px 7px;opacity:.55}
.pack .art.img{opacity:1;background-size:cover;background-position:center}
.pack .art.img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(20,8,40,.75))}
.pack .holo{position:absolute;inset:0;background:linear-gradient(115deg,transparent 18%,rgba(255,80,200,.45) 32%,rgba(255,240,120,.45) 42%,rgba(90,230,255,.45) 52%,rgba(170,120,255,.4) 62%,transparent 76%);background-size:260% 260%;mix-blend-mode:overlay;animation:holo 3.6s linear infinite}
.pack .frame{position:absolute;inset:10px 10px 18px;border-radius:4px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7),inset 0 0 0 4px rgba(255,255,255,.12),inset 0 0 0 5.5px rgba(255,230,160,.55)}
.pack .frame::before,.pack .frame::after{content:"✦";position:absolute;color:#FFE9A8;font-size:.8rem;text-shadow:0 0 6px #fff}
.pack .frame::before{left:6px;top:4px} .pack .frame::after{right:6px;bottom:4px}
.pack .emblem{position:relative;margin:34px auto 0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 20deg,#FFF6D0,#E8B64A,#FFF3C4,#B9822A,#FFE7A0,#C8902F,#FFF6D0);box-shadow:0 4px 10px rgba(0,0,0,.35),0 0 24px rgba(255,220,140,.5)}
.pack .emblem::before{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--pc) 40%,#fff),var(--pc) 55%,color-mix(in srgb,var(--pc) 45%,#1b0d33));box-shadow:inset 0 2px 6px rgba(0,0,0,.35)}
.pack .emblem::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed rgba(255,240,200,.7);animation:rspin 14s linear infinite}
.pack .emblem span{position:relative;font-size:2.6rem;color:#fff;text-shadow:0 0 10px #fff,0 0 22px #FFE08A,0 2px 0 rgba(0,0,0,.2)}
.pack .art.img ~ .emblem{display:none}
.pack .pname{position:relative;margin:18px 14px 0;padding:6px 8px;text-align:center;font-family:var(--head);font-size:1.3rem;color:#fff;line-height:1.15;word-break:keep-all;
  background:linear-gradient(90deg,transparent,rgba(20,8,40,.45) 12%,rgba(20,8,40,.45) 88%,transparent);border-top:1.5px solid rgba(255,225,150,.8);border-bottom:1.5px solid rgba(255,225,150,.8);text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(255,255,255,.4)}
.pack .art.img ~ .pname{position:absolute;left:0;right:0;bottom:44px;margin:0 14px}
.pack .psub{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:.58rem;letter-spacing:.32em;color:rgba(255,240,210,.95);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pack .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.75) 48%,transparent 56%);background-size:300% 100%;animation:pshine 3.2s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes pshine{0%,55%{background-position:120% 0}100%{background-position:-60% 0}}
.pack .seam{top:42px}
.pack .cnt10{top:58px;right:-14px;background:linear-gradient(180deg,#FFE08A,#E8A21C);color:#4A2A00;border:2px solid #fff}
.minipack{clip-path:none;border-radius:6px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,color-mix(in srgb,var(--pc) 45%,#fff),var(--pc) 45%,color-mix(in srgb,var(--pc) 50%,#1b0d33));box-shadow:0 4px 0 rgba(0,0,0,.12),inset 0 0 0 2px rgba(255,255,255,.55);text-align:center;padding:4px;line-height:1.15}
.minipack::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,rgba(255,80,200,.4) 35%,rgba(255,240,120,.4) 45%,rgba(90,230,255,.4) 55%,transparent 70%);background-size:250% 250%;mix-blend-mode:overlay;animation:holo 3.6s linear infinite}
.minipack::after{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 1px,transparent 1px 3px),color-mix(in srgb,var(--pc) 60%,#fff);border-bottom:1px dashed rgba(255,255,255,.9)}
.minipack.img{background-size:cover;background-position:center}

/* ===== star upgrade fx ===== */
.fxo.k-star .fxo-rays{background:repeating-conic-gradient(#FFD23F 0 5deg,transparent 5deg 12deg,#fff 12deg 15deg,transparent 15deg 22deg);opacity:.65}
.fxo.k-star .fxo-pic{width:170px;height:226px;border-radius:16px;background:none;box-shadow:none;overflow:visible;animation:none;margin-top:18px}
.fxo.k-star .fxo-pic .acard{width:100%;height:100%;animation:cardCharge 1.5s cubic-bezier(.3,0,.3,1) both}
@keyframes cardCharge{0%{transform:scale(.6) rotate(-8deg);filter:brightness(1)}35%{transform:scale(1) rotate(3deg);filter:brightness(1.2)}45%,55%{transform:scale(1.02) translateX(-4px);filter:brightness(1.6) saturate(.4)}50%,60%{transform:scale(1.02) translateX(4px)}70%{transform:scale(1.15);filter:brightness(3) saturate(0)}100%{transform:scale(1);filter:none}}
.fxo.k-star .whiteout{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:wout 1.5s ease-out forwards}
@keyframes wout{0%,62%{opacity:0}70%{opacity:.95}100%{opacity:0}}
.starrow{display:flex;justify-content:center;gap:4px;margin-top:10px;font-size:1.9rem;line-height:1}
.starrow span{color:var(--line);transform:scale(0);animation:starIn .45s var(--d) cubic-bezier(.2,1.8,.4,1) forwards}
.starrow span.on{color:#FFC400;text-shadow:0 0 10px rgba(255,196,0,.8)}
.starrow span.new{color:#FFC400;text-shadow:0 0 14px #FFE08A,0 0 28px #FFB300;animation:starIn .45s var(--d) cubic-bezier(.2,1.8,.4,1) forwards,starPulse 1.2s calc(var(--d) + .5s) ease-in-out infinite}
@keyframes starIn{to{transform:scale(1)}}
@keyframes starPulse{50%{transform:scale(1.35) rotate(15deg)}}
.starburst{position:absolute;left:50%;top:44%;pointer-events:none}
.starburst i{position:absolute;font-style:normal;color:#FFD23F;font-size:var(--fs);text-shadow:0 0 8px #FFE08A;opacity:0;animation:sbx 1.4s var(--d) cubic-bezier(.1,.8,.3,1) forwards}
@keyframes sbx{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.2) rotate(180deg)}}

/* ===== story / death ===== */
.storybtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:none;border-radius:20px;padding:12px 14px;text-align:left;color:#fff;background:linear-gradient(120deg,#A98BFF,#FF7EB3);box-shadow:0 5px 0 #C25A9E;animation:sbglow 2s ease-in-out infinite}
@keyframes sbglow{50%{box-shadow:0 5px 0 #C25A9E,0 0 24px rgba(255,126,179,.6)}}
.storybtn .sb-ic{font-size:1.8rem}
.storybtn b{font-family:var(--head);font-weight:400;font-size:1.05rem;display:block}
.storybtn small{opacity:.9}
.storybtn span:nth-child(2){flex:1}
.storybtn .sb-go{background:#fff;color:#C2457F;border-radius:12px;padding:4px 12px;font-family:var(--head)}
.storynext{margin-top:12px;font-size:.84rem;color:var(--sub);text-align:center;background:var(--field);border-radius:14px;padding:8px}
.book{background:linear-gradient(180deg,#FFF9EE,#FFF3DE);border-radius:20px;padding:16px;color:#4A3B2A;box-shadow:inset 0 0 0 2px #F2DDB4}
:root[data-theme="dark"] .book{background:linear-gradient(180deg,#2E2632,#28202C);color:var(--ink);box-shadow:inset 0 0 0 2px #4A3A50}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .book{background:linear-gradient(180deg,#2E2632,#28202C);color:var(--ink);box-shadow:inset 0 0 0 2px #4A3A50}}
.bk-tag{display:inline-block;font-size:.72rem;background:#FF7EB3;color:#fff;border-radius:8px;padding:1px 8px}
.book h3{margin:6px 0 8px!important}
.bk-text{white-space:pre-wrap;line-height:1.7;margin:0 0 14px}
.bk-q{font-family:var(--head);text-align:center;margin-bottom:10px}
.bk-choices{display:grid;gap:8px}
.bk-choice{border:2px solid #F2C5DA;background:#fff;border-radius:16px;padding:12px;font-family:var(--head);font-size:1rem;color:#4A3B2A;box-shadow:0 4px 0 #F2C5DA;text-align:left}
.bk-choice::before{content:"▶ ";color:#FF7EB3}
.bk-choice:active{transform:translateY(3px);box-shadow:none}
.ppanel.dead{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--line)}
.grave-h{font-family:var(--head);font-size:1.4rem;text-align:center}
.grave{position:absolute;bottom:40px;left:50%;margin-left:-40px;width:80px;border:none;background:none;text-align:center;cursor:pointer;z-index:3}
.grave .gs{font-size:3.4rem;display:block;filter:grayscale(.2);animation:bob 3s ease-in-out infinite}
.grave .ptag{position:static;transform:none;display:inline-block;margin-top:2px;background:rgba(255,255,255,.85)}
.grave.sel .gs{filter:drop-shadow(0 0 8px #fff)}
.chc{border:2px dashed var(--line);border-radius:18px;padding:10px;margin-bottom:10px}
.chc-h{font-family:var(--head);margin-bottom:6px}
.chc .field{margin-bottom:8px}
.formpick{display:flex;gap:8px;align-items:center}
.fth{width:44px;height:44px;border-radius:12px;background:var(--field);display:grid;place-items:center;overflow:hidden;color:var(--sub)}
.fth img{width:100%;height:100%;object-fit:contain}
.brchip{background:#E6F4FF!important;color:#2F6DB5!important;border-color:transparent!important;font-weight:700}

/* ===== feed / attendance / due ===== */
.bell{position:relative;border:none;background:var(--surface);border:2px solid var(--line);border-radius:14px;width:38px;height:34px;display:grid;place-items:center;color:var(--ink);margin-right:2px}
.bell svg{width:20px;height:20px}
.bell .dot{position:absolute;top:-6px;right:-6px;margin:0}
.mename{font-family:var(--head);font-size:.95rem;color:var(--ink);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:2px}
.loginlist{display:flex;flex-direction:column;gap:0}
.loginlist .member{padding:14px}
.profile .coinbtn{border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.coinbtn .cb-more{font-family:var(--body);font-size:.7rem;opacity:.75}
.mgrid{display:grid;gap:8px;margin-top:8px}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:1.5rem;letter-spacing:.12em;text-align:center;padding:16px 10px;border-radius:16px;background:var(--field);border:2px dashed var(--line);user-select:all;word-break:break-all}
.mgrid .btn{width:100%;text-align:left}
.quickrow{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.ledsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.ledsum>div{background:var(--field);border:2px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.ledsum small{font-size:.72rem;color:var(--sub)}
.ledsum b{font-family:var(--head);font-weight:400;font-size:1.05rem;display:flex;align-items:center;gap:4px}
.ledlist{max-height:46vh;overflow:auto;border:2px solid var(--line);border-radius:14px}
.led{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.led:last-child{border-bottom:none}
.led .lr{min-width:0;font-size:.9rem;word-break:break-word}
.led small{font-size:.72rem;color:var(--sub)}
.led .la{text-align:right;display:flex;flex-direction:column;flex:none}
.up{color:#13926C}.dn{color:#D6455D}
:root[data-theme="dark"] .up{color:#6FE3C0}:root[data-theme="dark"] .dn{color:#FF8FA3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .up{color:#6FE3C0}:root:not([data-theme="light"]) .dn{color:#FF8FA3}}
.viewer{gap:8px}
.feeditem{display:flex;gap:10px;padding:10px 4px;border-top:2px dashed var(--line);font-size:.9rem}
.feeditem:first-of-type{border-top:none}
.feeditem .fi{font-size:1.3rem}
.feeditem small{color:var(--sub);font-size:.72rem}
button.feeditem{width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;cursor:pointer;align-items:center}
button.feeditem .ft{flex:1;min-width:0}
.feeditem .fgo{color:var(--sub);font-size:1.3rem;padding:0 4px}
button.feeditem:active{background:var(--pink-soft);border-radius:14px}
.feeditem.new{background:var(--pink-soft);border-radius:14px;padding:10px;border-top-color:transparent;margin-bottom:4px}
.attend{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-top:14px;border:none;border-radius:22px;padding:12px 14px;background:linear-gradient(120deg,#FFE7A8,#FFD0E4);color:#4A3B2A;box-shadow:0 5px 0 #F2C77A;animation:sbglow 2.4s ease-in-out infinite}
.attend .at-ic{font-size:1.8rem}
.attend .at-b{flex:1;min-width:0}
.attend b{font-family:var(--head);font-weight:400;font-size:1.08rem;display:block}
.attend small{font-size:.78rem;opacity:.85}
.at-dots{display:flex;gap:4px;margin-top:5px}
.at-dots i{width:16px;height:6px;border-radius:4px;background:rgba(255,255,255,.7)}
.at-dots i.on{background:#FF8A3D}
.at-dots i.today{background:#FF7EB3;animation:pulse 1s infinite}
.attend .at-go{background:#fff;color:#E0558F;border-radius:12px;padding:5px 12px;font-family:var(--head)}
.chip.due{background:#FFF0D6;color:#9A5A00}
.chip.due.hot{background:#FFE0E0;color:#C23A3A;animation:pulse 1.2s infinite}
.chip.rep{background:#E6F4FF;color:#2F6DB5}
.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.days label{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--field);cursor:pointer;font-family:var(--head)}
.days input{position:absolute;opacity:0;pointer-events:none}
.days input:checked + span{color:#fff}
.days label:has(input:checked){background:var(--pink);border-color:var(--pink);color:#fff}

/* ===== difficulty / exam ===== */
.brand{white-space:nowrap}
@media (max-width:440px){.viewer label[for="vsel"]{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diffbtn{border:2px solid var(--line);background:var(--field);border-radius:20px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.diffbtn:active{transform:translateY(3px);box-shadow:none}
.diffbtn .di{font-size:2rem}
.diffbtn b{font-family:var(--head);font-weight:400;font-size:1.05rem}
.diffbtn small{color:var(--sub);font-size:.75rem}
.diffbtn.d-easy{border-color:#9EE6C9;box-shadow:0 4px 0 #9EE6C9}
.diffbtn.d-hard{border-color:#FFA3A3;box-shadow:0 4px 0 #FFA3A3}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.legend span{font-size:.78rem;background:var(--field);border-radius:10px;padding:2px 8px}
.legend span.bad{background:#FFE3E3;color:#B33A3A}
.legend.sm{margin-top:8px}
.weed.badw{filter:drop-shadow(0 0 4px rgba(255,255,255,.9))}
.weed.oops{animation:oops .45s ease-in-out forwards}
@keyframes oops{20%,60%{transform:translate(-50%,-50%) rotate(-18deg) scale(1.2)}40%,80%{transform:translate(-50%,-50%) rotate(18deg) scale(1.2)}100%{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.weedfield.hurt{animation:hurt .4s}
@keyframes hurt{30%{box-shadow:inset 0 0 0 6px #FF6B6B;transform:translateX(-4px)}60%{transform:translateX(4px)}}
.wpop{position:absolute;transform:translate(-50%,-50%);font-family:var(--head);font-size:1.1rem;color:#fff;text-shadow:0 2px 0 #3D7A2E;pointer-events:none;animation:dmgup .7s ease-out forwards;white-space:nowrap}
.wpop.neg{color:#FF4D7A;text-shadow:0 2px 0 #fff}
.wpop.cb{color:#FFE14D;text-shadow:0 2px 0 #B07A00;font-size:1.2rem}
.combo{font-size:.85rem;color:#E0558F}
.examcard{background:linear-gradient(180deg,#FFFDF6,#FFF6E2);border-radius:22px;padding:18px;color:#4A3B2A;box-shadow:inset 0 0 0 2px #F2DDB4;text-align:center}
:root[data-theme="dark"] .examcard{background:linear-gradient(180deg,#2E2A22,#26221C);color:var(--ink);box-shadow:inset 0 0 0 2px #4A4030}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .examcard{background:linear-gradient(180deg,#2E2A22,#26221C);color:var(--ink);box-shadow:inset 0 0 0 2px #4A4030}}
.ex-h{font-family:var(--head);font-size:1.2rem}
.ex-g{display:inline-block;margin:8px 0 12px;font-family:var(--head);font-size:2.4rem;color:#fff;background:linear-gradient(180deg,#FF9AC4,#E0558F);border-radius:18px;padding:2px 20px;box-shadow:0 4px 0 #B83A70}
.ex-rows{display:grid;gap:6px;text-align:left;margin-bottom:10px}
.ex-rows div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #E8D3A8;padding-bottom:5px;font-size:.88rem}
.ex-rows span{color:#9A8460}
.ex-rows b{font-weight:700;text-align:right}
.pr-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:2px dashed var(--line)}
.pr-row:first-of-type{border-top:none}
.pr-row b{font-family:var(--head);font-weight:400}
.pr-d{display:flex;gap:6px}
.licchip{background:#FFF0D6!important;color:#9A5A00!important;border-color:transparent!important;font-weight:700}
.map-exam{background:linear-gradient(180deg,#E8F1FF 0%,#F4F8FF 58%,#C9B48E 58.5%,#B59B70 100%)}
.chalk{position:absolute;top:30px;left:50%;margin-left:-90px;width:180px;height:70px;background:#2F5D4A;border:6px solid #A87447;border-radius:8px;color:#fff;font-family:var(--head);font-size:.9rem;display:grid;place-items:center;letter-spacing:.1em}
.desk{position:absolute;bottom:38%;left:var(--x);width:56px;height:20px;background:#C98E5A;border-radius:4px;box-shadow:0 10px 0 -4px #8A5A3B}
.act-exam .pb{animation:write .5s ease-in-out infinite alternate}
@keyframes write{to{transform:translateY(4px) rotate(3deg)}}
.act-exam .pe1{left:60%;bottom:8%;font-size:1.4rem;animation:scribble .5s ease-in-out infinite alternate}
.act-exam .pe2{left:-2%;bottom:4%;font-size:1.5rem}
@keyframes scribble{from{transform:rotate(-20deg) translateX(-4px)}to{transform:rotate(10deg) translateX(4px)}}

/* ===== ramen / catch / whack / study ===== */
.rou-sign{background:#2E2A26;color:#FFE9C2;border-radius:14px;padding:8px 12px;font-family:var(--head);text-align:center;font-size:.95rem;border:3px solid #8A5A3B}
.rou-sign small{font-family:var(--body);color:#E6C99A;font-size:.75rem}
.rou-memo{margin:10px 0;background:#FFF9E8;border:2px dashed #F2C77A;border-radius:16px;padding:10px;text-align:center;color:#5A4320}
.rou-memo span{display:inline-block;margin:3px;background:#fff;border-radius:10px;padding:3px 10px;font-family:var(--head);box-shadow:0 2px 0 #F2DDB4}
.rm-h{font-size:.82rem;margin-bottom:4px}
.rou-master{display:flex;align-items:center;gap:10px;margin:6px 0}
.rm-face{font-size:2.6rem}
.rm-face.glare{animation:hitshake .5s}
.rm-say{position:relative;background:var(--field);border-radius:16px;padding:8px 12px;font-family:var(--head)}
.rou-call{min-height:38px;background:var(--field);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:.9rem}
.rou-call b{font-family:var(--head);font-weight:400;color:var(--pinkd)}
.rou-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rchipb{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-family:var(--head);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.rchipb:active{transform:translateY(2px);box-shadow:none}
.catchfield{position:relative;height:340px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#CDEBFF,#E8F6FF 70%,#A6DC8C 70.5%);touch-action:none;user-select:none}
.fall{position:absolute;font-size:1.9rem;transform:translate(-50%,-50%);pointer-events:none}
.fall.poison{filter:drop-shadow(0 0 4px #B44CFF)}
.basket{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.basket .bpet{width:52px;height:52px;display:grid;place-items:center;font-size:2rem}
.basket .bpet img{width:100%;height:100%;object-fit:contain}
.basket .bk{font-size:2.2rem;line-height:1;margin-top:-14px}
.catchctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.catchctl .btn{min-width:56px;font-size:1.2rem}
.whack{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;border-radius:22px;background:linear-gradient(180deg,#B8E59E,#8FCB73);user-select:none}
.hole{position:relative;aspect-ratio:1;border:none;border-radius:50%;background:radial-gradient(circle at 50% 70%,#4E7A3A,#2F5226 70%);overflow:hidden;box-shadow:inset 0 6px 0 rgba(0,0,0,.25)}
.hole .mol{position:absolute;left:0;right:0;bottom:-70%;font-size:2.4rem;transition:bottom .12s ease-out;text-align:center}
.hole.up .mol{bottom:10%}
.hole.hit .mol{transform:scale(1.25) rotate(-10deg);filter:brightness(1.6)}
.whack.hurt{animation:hurt .4s}
.whack .gmcount{border-radius:22px}
.studybox{display:flex;align-items:center;justify-content:center;gap:16px;height:150px;background:linear-gradient(180deg,#FFF0F5,#FFE3EE);border-radius:22px;margin-bottom:10px}
.studybox .spet{width:90px;height:90px;display:grid;place-items:center;font-size:3rem}
.studybox .spet img{width:100%;height:100%;object-fit:contain}
.book3d{font-size:3.2rem}
.book3d.flip{animation:bflip .25s ease-in-out}
@keyframes bflip{50%{transform:rotateY(80deg) scale(1.1)}}
.studychip{background:#EFE6FF!important;color:#6A45C9!important;border-color:transparent!important;font-weight:700}

/* ===== duel exam ===== */
.duel{position:relative;height:360px;border-radius:22px;overflow:hidden;user-select:none;touch-action:pan-y;background:#BFE6FF}
.d-sky{position:absolute;inset:0 0 45% 0;background:linear-gradient(180deg,#9FD4FF,#DDF1FF)}
.d-road{position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(180deg,#8FCB73,#6FB55A)}
.d-road::before{content:"";position:absolute;left:50%;bottom:0;width:70%;height:100%;transform:translateX(-50%);background:linear-gradient(180deg,#D9C09A,#C9A87A);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%)}
.d-tag{position:absolute;top:10px;font-family:var(--head);font-size:.8rem;background:rgba(255,255,255,.85);border-radius:10px;padding:2px 8px;z-index:3}
.d-tag.l{left:10px;color:#C23A3A} .d-tag.r{right:10px;color:#13805F}
.foe{position:absolute;left:50%;top:42%;width:120px;height:120px;margin:-60px 0 0 -60px;display:grid;place-items:center;font-size:5rem;transform:translateY(-40px) scale(.15);opacity:0;z-index:2}
.foe img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.foe.come{animation:approach var(--appr) linear forwards}
@keyframes approach{0%{opacity:0;transform:translateY(-40px) scale(.15)}10%{opacity:1}100%{opacity:1;transform:translateY(70px) scale(1.5)}}
.foe.slashed{animation:slashed .38s ease-out forwards}
@keyframes slashed{0%{filter:brightness(2)}100%{opacity:0;transform:translate(-120px,40px) rotate(-60deg) scale(.8)}}
.foe.slashed::after{content:"";position:absolute;left:-20%;top:50%;width:140%;height:6px;background:#fff;box-shadow:0 0 12px #fff;transform:rotate(-25deg);border-radius:6px}
.foe.passed{animation:passed .38s ease-in forwards}
@keyframes passed{to{opacity:0;transform:translate(180px,10px) scale(.9) rotate(15deg)}}
.foe.oops{animation:oopsf .38s ease-out forwards}
@keyframes oopsf{30%{transform:scale(1.1) rotate(-10deg);filter:sepia(1) hue-rotate(-40deg)}100%{opacity:0;transform:scale(.6)}}
.foe.hitme{animation:hitme .38s ease-in forwards}
@keyframes hitme{to{opacity:0;transform:translateY(160px) scale(2.4)}}
.sword{position:absolute;right:4%;bottom:-30px;width:40px;height:220px;transform-origin:50% 100%;transform:rotate(-18deg);z-index:4;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
.sword .blade{position:absolute;left:8px;top:0;width:24px;height:150px;background:linear-gradient(90deg,#C9D3E0,#FFFFFF 45%,#A9B6C8);clip-path:polygon(50% 0,100% 10%,100% 100%,0 100%,0 10%);border-radius:2px}
.sword .guard{position:absolute;left:-12px;top:148px;width:64px;height:14px;border-radius:7px;background:linear-gradient(180deg,#FFE08A,#C9902F)}
.sword .hilt{position:absolute;left:12px;top:160px;width:16px;height:60px;border-radius:6px;background:repeating-linear-gradient(0deg,#7A4A2A 0 6px,#9A6238 6px 12px)}
.sword.swing{animation:swing2 .32s cubic-bezier(.3,1.4,.5,1)}
@keyframes swing2{0%{transform:rotate(-18deg)}40%{transform:rotate(-95deg) translateX(-30px)}100%{transform:rotate(-18deg)}}
.duel.hurt{animation:hurt .4s}
.duel .gmcount{z-index:6}
.duelctl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duelctl .btn{display:flex;flex-direction:column;align-items:center;padding:12px 6px;font-size:1.1rem}
.duelctl small{font-family:var(--body);font-size:.72rem;opacity:.85}
.artsec{margin-top:10px}
.artsec > b{font-family:var(--head);font-weight:400;display:flex;gap:6px;align-items:center}
.artgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.artth{position:relative;aspect-ratio:1;border-radius:14px;background:var(--field);overflow:hidden;border:2px solid var(--line)}
.artth img{width:100%;height:100%;object-fit:contain}
.artth button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem}
.artadd{aspect-ratio:1;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.4rem;color:var(--sub);cursor:pointer}
.artadd small{font-size:.6rem}

/* ===== sake memory ===== */
.saketable{border-radius:22px;padding:10px;background:linear-gradient(180deg,#7A4A2A,#5E3820);box-shadow:inset 0 0 0 4px #A8744A}
.sakegrid{display:grid;gap:6px}
.scard{aspect-ratio:3/4;border:none;padding:0;background:none;perspective:500px;cursor:pointer}
.sc-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .3s}
.scard.show .sc-in,.scard.done .sc-in{transform:rotateY(180deg)}
.sc-b,.sc-f{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sc-b{background:repeating-linear-gradient(45deg,#FF9AC4 0 6px,#FFB8D6 6px 12px);border:3px solid #fff;font-size:1.1rem}
.sc-f{transform:rotateY(180deg);background:#FFF9EE;border:3px solid #F2DDB4;font-size:1.8rem;overflow:hidden}
.sc-f img{width:88%;height:88%;object-fit:contain}
.scard.done .sc-f{border-color:#7FE0BF;box-shadow:0 0 12px #7FE0BF;animation:pop .35s}
.scard.nope .sc-in{animation:hitshake .3s}
.catchfield.custom,.duel.custom{background-size:cover;background-position:center}
.fall img{width:40px;height:40px;object-fit:contain;display:block}
.bgslot{display:flex;align-items:center;gap:10px;margin:8px 0}
.bgslot .bgth{width:72px;height:48px;border-radius:10px;background:var(--field);overflow:hidden;display:grid;place-items:center;color:var(--sub);font-size:.7rem;border:2px solid var(--line)}
.bgslot .bgth img{width:100%;height:100%;object-fit:cover}
.examsec{border-top:2px dashed var(--line);padding-top:10px;margin-top:10px}
.examsec:first-of-type{border-top:none;margin-top:0;padding-top:0}
.examsec > b{font-family:var(--head);font-weight:400;font-size:1.05rem}

/* ===== extension ===== */
.extbox{margin-top:10px;padding:10px 12px;border-radius:16px;background:var(--field);font-size:.88rem}
.extbox.ask{background:#FFF3D6;color:#6A4A00}
.extbox.offer{background:#E6F4FF;color:#1F4E80}
:root[data-theme="dark"] .extbox.ask,:root[data-theme="dark"] .extbox.offer{color:var(--ink);background:var(--field)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .extbox.ask,:root:not([data-theme="light"]) .extbox.offer{color:var(--ink);background:var(--field)}}
.extbox b{font-family:var(--head);font-weight:400}
.extdiff{margin-top:6px;line-height:1.7}
.extdiff b{font-family:var(--body);font-weight:700;color:#E0558F}
.extmsg{margin-top:6px;font-style:italic;opacity:.85}
.extchk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.extchk input{width:auto}
.chip.ext{background:#EFE6FF;color:#6A45C9}

/* ===== battle / forage / nap ===== */
.battle{display:flex;flex-direction:column;gap:8px}
.battle.quakeb{animation:quakeL .6s}
.battle.boom{animation:quake .5s}
.b-top{position:relative;text-align:center;background:linear-gradient(180deg,#FFE6D2,#FFF4EA);border-radius:20px;padding:10px 10px 8px}
.b-intent{display:inline-block;font-size:.82rem;border-radius:12px;padding:3px 10px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08);margin-bottom:4px}
.b-intent.i-strong{background:#FFE0E0;color:#C23A3A;animation:pulse .8s infinite;font-weight:700}
.b-intent.i-rest{background:#DCF7EE;color:#118A66}
.b-intent.i-guard{background:#E6F4FF;color:#2F6DB5}
.b-mon{position:relative;font-size:4.2rem;line-height:1.1;animation:bob 1.4s ease-in-out infinite}
.b-mon.hit span{display:inline-block;animation:hitshake .45s}
.b-mon img{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));vertical-align:middle}
.hpbar{position:relative;height:16px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden;margin-top:4px}
.hpbar i{display:block;height:100%;border-radius:999px;transition:width .4s}
.hpbar.m i{background:linear-gradient(90deg,#FF6B6B,#FF9A7A)}
.hpbar.p i{background:linear-gradient(90deg,#4FCFA8,#8FF0CF)}
.hpbar b{position:absolute;inset:0;display:grid;place-items:center;font-size:.68rem;color:#3D3456}
.b-name{font-family:var(--head)}
.b-log{min-height:40px;background:var(--field);border-radius:14px;padding:8px 12px;font-size:.88rem;text-align:center}
.b-log.blink{animation:up .25s ease-out}
.b-me{position:relative;display:flex;align-items:center;gap:10px}
.b-me.hit .b-ppic{animation:hitshake .45s}
.b-ppic{width:58px;height:58px;border-radius:18px;background:var(--field);display:grid;place-items:center;font-size:2.2rem;overflow:hidden;flex:none}
.b-ppic img{width:100%;height:100%;object-fit:contain}
.b-gauge{font-size:.78rem;color:#E0558F;margin-top:4px;font-family:var(--head)}
.b-bar{height:38px;cursor:pointer}
.b-bar .pzone{position:absolute;top:0;bottom:0;background:#13A37A;border-radius:6px}
.b-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b-acts.off{opacity:.4;pointer-events:none}
.dmg.crit{color:#FF9500;font-size:1.5rem}
.dmg.miss{color:#8C84A6}
.dmg.big{color:#FF2E5A;font-size:1.6rem}
.dmg.heal{color:#13A37A}
.bushgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;border-radius:22px;background:linear-gradient(180deg,#9ED7B5,#6FB57A)}
.bushgrid.hurt{animation:hurt .4s}
.bcell{position:relative;aspect-ratio:1;border:none;border-radius:18px;background:radial-gradient(circle at 40% 30%,#C8EFA8,#7BC260);font-size:1.9rem;box-shadow:0 4px 0 #5E9E48;animation:rustle 1.8s ease-in-out infinite;cursor:pointer}
.bcell:nth-child(3n){animation-delay:-.6s}.bcell:nth-child(4n){animation-delay:-1.1s}
.bcell.open{animation:pop .35s cubic-bezier(.2,1.8,.4,1);box-shadow:none;font-size:1.3rem}
.bcell.good{background:radial-gradient(circle,#FFF6C4,#FFE08A)}
.bcell.rare{background:radial-gradient(circle,#FFE3F0,#FFB3D4);font-size:1.9rem;box-shadow:0 0 16px #FF7EB3}
.bcell.bee{background:radial-gradient(circle,#FFE0A0,#FFB547);font-size:1.9rem}
.bcell.empty{background:rgba(255,255,255,.55)}
.bcell .leaf{opacity:.5}
.bcell .near{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--head);font-size:1.5rem;color:#2F6DB5}
.bcell .near.n2{color:#13A37A}.bcell .near.n3,.bcell .near.n4{color:#E0558F}
.bcell.peek{opacity:.55;animation:none;font-size:1.3rem}
.napfx{position:fixed;inset:0;z-index:44;display:grid;place-items:center;background:rgba(20,15,45,.75);animation:fxin .3s;cursor:pointer}

  return fs.runTransaction(async tx=>{ const sn=await tx.get(L); const d=sn.exists?sn.data():null, now=Date.now();

/* ---------- 사진 저장소: Cloudinary (unsigned upload) ----------
   API Secret은 코드에 넣지 않아요. 업로드 프리셋(unsigned)만 사용하고, 받은 secure_url을 그대로 문서에 저장해요.
   unsigned 업로드로는 삭제가 안 되므로, 안 쓰는 사진 정리는 Cloudinary 콘솔(또는 서버 함수)에서 해요. */

function cloudinaryAssets(){ if(!CLOUDINARY.cloud||/여기에/.test(CLOUDINARY.cloud)) return null;
  return { kind:"cloudinary",
    async upload(blob){
      if(!/^image\//.test(blob.type)) throw {code:"unsupported_type"};

      let j={}; try{ j=await r.json(); }catch(e){}
