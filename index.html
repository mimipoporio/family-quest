  if(aiUsed()>=AI_LIMIT) return toast(`오늘은 ${AI_LIMIT}번 다 봤어요. 내일 또 물어봐 주세요.`);
  petBusy=true; render();
  const top=$("#diaryTop"); if(top) top.innerHTML=`<div class="diary loading"><div class="dt">캐릭터들의 하루<small>지금</small></div><p class="dots">무엇을 했는지 떠올리는 중</p><div class="actions"><button class="btn ghost sm" data-act="petStop">그만</button></div></div>`;
  petCtl=new AbortController();
  const locs={}; pets.forEach(p=>locs[p.id]=mapName(petLoc(p)));
  try{
    let r=null; if(aiReady()){ try{ r=await aiJSON(petsPrompt(pets),{signal:petCtl.signal}); }catch(e){ if(e&&e.code==="cancelled") throw e; aiWarn(e); } }
    if(!r||!Array.isArray(r.pets)||!r.pets.some(x=>x&&x.story)){ const sd=Date.now(); r={pets:pets.map(p=>({id:p.id,...localTale(p,sd),mood:1})),together:[]}; }
    const list=Array.isArray(r?.pets)?r.pets:[]; const tg=Array.isArray(r?.together)?r.together:[];
    if(!list.some(x=>x&&x.story)) throw {code:"invalid_json"};
    const now=Date.now(); let wrote=0;
    commit(s=>{
      list.forEach(x=>{ const pp=s.pets.find(y=>y.id===x?.id&&y.ownerId===viewerId); if(!pp||!x.story) return; wrote++;
        const P=freshen(pp); const md=Math.max(-5,Math.min(5,parseInt(x.mood,10)||0)); const trait=String(x.trait||"").replace(/[#\s]/g,"").slice(0,8);
        pp.log.unshift({ts:now,title:String(x.title||"오늘의 이야기").slice(0,30),story:String(x.story).slice(0,600),line:String(x.line||"").slice(0,120),loc:locs[pp.id]});
        addGxp(pp,4); setPetStats(pp,{mood:P.mood+md*2}); if(trait) pp.traits[trait]=(pp.traits[trait]||0)+1; pp.log=pp.log.slice(0,30); });
      tg.forEach(g=>{ const ids=(Array.isArray(g?.ids)?g.ids:[]).filter(id=>s.pets.some(y=>y.id===id&&y.ownerId===viewerId)); if(ids.length<2||!g.story||new Set(ids.map(id=>locs[id])).size>1) return;
        ids.forEach(id=>{ const pp=s.pets.find(y=>y.id===id); const others=ids.filter(z=>z!==id).map(z=>s.pets.find(y=>y.id===z)?.nick).filter(Boolean);
          pp.log.unshift({ts:now+1,title:String(g.title||"함께한 시간").slice(0,30),story:String(g.story).slice(0,600),together:true,with:others,loc:locs[id]}); addGxp(pp,2); pp.log=pp.log.slice(0,30);
          pp.bond=pp.bond||{}; ids.filter(z=>z!==id).forEach(z=>{ pp.bond[z]=(pp.bond[z]||0)+3; }); }); });
      s.aiUse=s.aiUse||{}; const u=s.aiUse[viewerId]; const d=dkey(now); s.aiUse[viewerId]={day:d,n:(u&&u.day===d?u.n:0)+1};
    });
    flushPetLv(); toast(selPet?"생활 기록이 새로 쌓였어요.":"새 이야기가 생겼어요. 캐릭터를 찾아 눌러서 읽어 보세요.");
  }catch(e){ if(e&&e.code!=="cancelled") toast(SAMPLE_ERR[e&&e.code]||"이야기를 불러오지 못했어요. 다시 시도해 주세요."); }
  finally{ petBusy=false; petCtl=null; render(); }
}

function stageFx(pid,kind,emoji){

  let x=50,y=60; if(w){ const a=st.getBoundingClientRect(), b=(w.querySelector(".mover")||w).getBoundingClientRect(); x=((b.left+b.width/2-a.left)/a.width*100); y=((b.top+b.height/2-a.top)/a.height*100); w.classList.remove("jump"); void w.offsetWidth; w.classList.add("jump"); }
  const conf={pat:["💗","#FF7EB3",["💗","💕","✨"]],food:["🍙","#FFB65C",[emoji||"🍙","✨","⭐"]],wash:["🫧","#7CC4FF",["🫧","🫧","✨"]],gift:["🎁","#A98BFF",[emoji||"🎁","✨","💖"]],freeze:["🔒","#7B8CFF",["❄️","✨","🔒"]],event:["🌟","#FFD23F",["🌟","✨","💫"]]}[kind]||["✨","#FF7EB3",["✨"]];

  for(let i=0;i<14;i++){ const a=i/14*Math.PI*2, d=60+Math.random()*60; add("sfx-p",conf[2][i%conf[2].length],`--x:${x}%;--y:${y}%;--dx:${Math.cos(a)*d|0}px;--dy:${Math.sin(a)*d-20|0}px;animation-delay:${(Math.random()*.15).toFixed(2)}s`,1400); }

function weedPop(f,w,txt,cls){ const e=document.createElement("span"); e.className="wpop "+(cls||""); e.textContent=txt; e.style.left=w.style.left; e.style.top=w.style.top; f.appendChild(e); setTimeout(()=>e.remove(),700); }
function runWeed(){
  const f=$("#wField"); if(!f||!game) return; const cfg=game.opt.cfg, T=cfg.time, t0=Date.now();
  const hud=()=>{ const sc=$("#wScore"), cb=$("#wCombo"); if(sc){ sc.textContent="🌿 "+game.score; sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump"); } if(cb) cb.textContent=game.combo>=2?`콤보 ${game.combo}`:""; };
  const tick=setInterval(()=>{ const el=$("#wTime"); if(!el){ clearInterval(tick); return; } const r=1-(Date.now()-t0)/T; el.style.width=Math.max(0,r*100)+"%"; if(r<=0){ clearInterval(tick); clearInterval(sp); endWeed(); } },100);
  const sp=setInterval(()=>{ if(!game) return; const roll=Math.random(); const bad=roll<cfg.bad, gold=!bad&&roll<cfg.bad+cfg.gold;
    const w=document.createElement("button"); w.className="weed"+(gold?" gold":"")+(bad?" badw":"");
    w.textContent=bad?BAD_WEEDS[Math.random()*BAD_WEEDS.length|0]:gold?"🌟":["🌿","🌱","☘️"][Math.random()*3|0]; w.setAttribute("aria-label",bad?"뽑으면 안 되는 것":"잡초");
    w.style.left=(6+Math.random()*80)+"%"; w.style.top=(8+Math.random()*72)+"%";
    w.addEventListener("pointerdown",ev=>{ ev.preventDefault(); if(w.classList.contains("pulled")||!game) return;
      if(bad){ w.classList.add("oops"); game.score=Math.max(0,game.score-2); game.combo=0; game.bad++; weedPop(f,w,"-2 앗!","neg"); f.classList.remove("hurt"); void f.offsetWidth; f.classList.add("hurt"); hud(); setTimeout(()=>w.remove(),450); return; }
      w.classList.add("pulled"); game.combo++; let add=gold?3:1; if(game.combo%5===0){ add+=1; weedPop(f,w,`콤보 보너스! +${add}`,"cb"); } else weedPop(f,w,"+"+add); game.score+=add; hud(); setTimeout(()=>w.remove(),350); });
    f.appendChild(w); setTimeout(()=>{ if(w.isConnected&&!w.classList.contains("pulled")&&!w.classList.contains("oops")){ w.classList.add("gone"); if(!bad&&game) game.combo=0; hud(); setTimeout(()=>w.remove(),250); } },cfg.life); },cfg.spawn);
  game.timers.push(tick,sp);
}
function endWeed(){

const BATTLE_CFG={easy:{hp:1,atk:.95,zone:20},normal:{hp:1.3,atk:1.25,zone:15},hard:{hp:1.65,atk:1.6,zone:11}};
const INTENTS={atk:["💢","공격하려고 해요"],strong:["🔥","강한 공격을 준비해요! 방어하는 게 좋아요"],rest:["💤","숨을 고르고 있어요. 지금이 기회!"],guard:["🛡️","방어 자세예요. 공격이 덜 들어가요"]};
function startHunt(pid,opt){

const isDailyQ=(q,s)=>!!q.repeatId&&(q.daily||((s||state).repeats||[]).find(r=>r.id===q.repeatId)?.freq==="daily");

const WARN_MS=3*3600000; // 마감 3시간 전에 '곧 실패' 경고

const KEEP_MS=183*86400000;

  s.feed=(s.feed||[]).filter(f=>(f.ts||0)>=cut);
  s.ledger=(s.ledger||[]).filter(l=>l.t>=cut); if(s.ledger.length>1500) s.ledger=s.ledger.slice(-1500);

/* ---------- ranking ---------- */
const RK_P=[["day","오늘"],["week","이번 주"],["month","이번 달"],["year","올해"]];
const RK_C=[["total","종합"],["coin","코인 획득"],["level","레벨 상승"],["quest","퀘스트 클리어"]];
function rankRows(){
  const [from,to]=periodRange(rkPeriod,rkOff), agg={};
  state.members.forEach(m=>agg[m.id]={c:0,x:0,q:0});
  for(const [k,day] of Object.entries(state.stats||{})) if(k>=from&&k<to) for(const [mid,r] of Object.entries(day)) if(agg[mid]){ agg[mid].c+=r.c; agg[mid].x+=r.x; agg[mid].q+=r.q; }
  return state.members.map(m=>{ const a=agg[m.id]; const lv=levelInfo(m.xp).lvl, lv0=levelInfo(Math.max(0,m.xp-a.x)).lvl; const up=lv-lv0;
    const score=a.c+a.x+a.q*30;
    const v={total:[score,`${score}점`,`코인 ${a.c} · 경험치 ${a.x} · 퀘스트 ${a.q}`],coin:[a.c,`${a.c}코인`,""],level:[up*100000+a.x,`+${up}레벨`,`경험치 ${a.x}`],quest:[a.q,`${a.q}개`,""]}[rkCat];
    return {m,sort:v[0],val:v[1],sub:v[2]}; }).sort((a,b)=>b.sort-a.sort||levelInfo(b.m.xp).lvl-levelInfo(a.m.xp).lvl);
}
function rankAv(m){ const f=avatarImg(m); return `<div class="av">${f&&f.card.photo?cardPic(f.card):esc(m.name.slice(0,1))}</div>`; }
function rankHTML(){
  const rows=rankRows();
  const fp=RK_P.map(([k,l])=>`<button class="${rkPeriod===k?"on":""}" data-act="rkP" data-k="${k}">${l}</button>`).join("");
  const fc=RK_C.map(([k,l])=>`<button class="${rkCat===k?"on":""}" data-act="rkC" data-k="${k}">${l}</button>`).join("");
  const medals=["🥇","🥈","🥉"];
  const pod=rows.slice(0,3), order=[1,0,2].filter(i=>pod[i]);
  const podium=pod.length?`<div class="podium">${order.map(i=>{const r=pod[i];return `<div class="pd p${i+1} ${r.m.id===viewerId?"me":""}"><div class="medal">${medals[i]}</div>${rankAv(r.m)}
    ${memberTitleHTML(r.m)}<div class="nm">${esc(r.m.name)}</div><span class="lvmini">Lv.${levelInfo(r.m.xp).lvl}</span><div class="val">${r.sort>0?r.val:"-"}</div></div>`;}).join("")}</div>`:"";
  const rest=rows.slice(3).map((r,i)=>`<div class="rk ${r.m.id===viewerId?"me":""}"><div class="no">${i+4}</div>${rankAv(r.m)}
    <div class="info"><div class="top"><b>${esc(r.m.name)}</b><span class="lvmini">Lv.${levelInfo(r.m.xp).lvl}</span></div>${memberTitleHTML(r.m)}</div>
    <div class="val">${r.sort>0?r.val:"-"}${r.sub?`<small>${r.sub}</small>`:""}</div></div>`).join("");
  const note=rkCat==="total"?'<p class="hint">종합 점수 = 획득 코인 + 획득 경험치 + 클리어 퀘스트 × 30</p>':"";
  const nav=`<div class="rknav"><button class="btn ghost sm" data-act="rkOff" data-d="1">◀ 이전</button><b>${esc(periodLabel(rkPeriod,rkOff))}</b><button class="btn ghost sm" data-act="rkOff" data-d="-1" ${rkOff>0?"":"disabled"}>다음 ▶</button></div>`;
  const weekly=rkPeriod==="week"?(()=>{ const W=12, cols=[]; for(let i=0;i<W;i++){ const [a,b]=periodRange("week",i); const agg={}; state.members.forEach(m=>agg[m.id]=0); for(const [k,day] of Object.entries(state.stats||{})) if(k>=a&&k<b) for(const [mid,r] of Object.entries(day)) if(mid in agg) agg[mid]+=r.c||0; cols.push({i,a,agg}); }
    return `<h2>주간 코인 획득 <span class="count">최근 ${W}주</span></h2><div class="card" style="padding:8px 4px;overflow-x:auto"><table class="wkt"><thead><tr><th>주</th>${state.members.map(m=>`<th>${esc(m.name)}</th>`).join("")}</tr></thead><tbody>${cols.map(c=>`<tr class="${c.i===rkOff?"on":""}"><td><button class="lnk" data-act="rkGo" data-i="${c.i}">${c.i===0?"이번 주":c.i===1?"지난 주":c.i+"주 전"}<small>${+c.a.slice(5,7)}/${+c.a.slice(8,10)}~</small></button></td>${state.members.map(m=>`<td>${c.agg[m.id]||0}</td>`).join("")}</tr>`).join("")}</tbody></table><p class="hint" style="margin:6px 8px 0">퀘스트 보상과 출석으로 번 코인만 세요(방장 직접 지급·벌칙·구매 제외). 월요일부터 일요일까지가 한 주예요.</p></div>`; })():"";
  const sub3=rows.slice(0,3).some(r=>r.sub)?`<div style="margin-top:-4px">${rows.slice(0,3).map((r,i)=>r.sub?`<p class="hint" style="margin:2px 0">${medals[i]} ${esc(r.m.name)}: ${r.sub}</p>`:"").join("")}</div>`:"";
  return `<div class="seg">${fp}</div>${nav}<div class="rkfilters">${fc}</div>${podium}${sub3}${rest}${note}${weekly}`;
}

function bindTear(gx,onTear){
  const pack=$("#gxPack"), top=pack.querySelector(".top"); let drag=null, torn=false;
  const tear=()=>{ if(torn) return; torn=true; top.style.transform=""; gx.style.setProperty("--leak",1); onTear(); };
  gx._tear=tear;
  pack.addEventListener("pointerdown",e=>{ if(torn) return; drag={x:e.clientX,dx:0}; try{pack.setPointerCapture(e.pointerId);}catch(_){} pack.style.animation="none"; });
  pack.addEventListener("pointermove",e=>{ if(!drag||torn) return; drag.dx=e.clientX-drag.x; top.style.transition="none"; top.style.transform=`translateX(${drag.dx*.5}px) rotate(${drag.dx/14}deg)`; gx.style.setProperty("--leak",Math.min(1,Math.abs(drag.dx)/110)); });
  const end=()=>{ if(!drag||torn) return; const dx=Math.abs(drag.dx); drag=null; top.style.transition=""; pack.style.animation="";
    if(dx>70||dx<6) tear(); else { top.style.transform=""; gx.style.setProperty("--leak",0); } };
  pack.addEventListener("pointerup",end); pack.addEventListener("pointercancel",end);
  pack.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tear(); } });
  pack.focus();
}

async function shrink(file){
  if(file.type==="image/gif") return file;
  try{
    const bmp=await createImageBitmap(file); const max=1200; // 긴 변 1200px 이하 const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",0.85)); if(b&&b.type==="image/webp"){ b._shrunk=true; return b; }
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.85))||file;
  }catch(e){ return file; }
}

document.addEventListener("input",ev=>{ if(ev.target.id==="tName") updateTitlePreview(); });
document.addEventListener("submit",ev=>{
  if(ev.target.id==="chatForm"){ ev.preventDefault(); const t=$("#chatIn").value.trim(); if(!t) return; $("#chatIn").value=""; sendChat(ev.target.dataset.id,t); return; }
  if(ev.target.id==="ckCatForm"){ ev.preventDefault(); const c=$("#ckCatIn").value.trim(); if(!c) return;
    if(ckCats(viewerId).includes(c)) return toast("이미 있는 카테고리예요.");
    if(ckCats(viewerId).length>=12) return toast("카테고리는 12개까지 만들 수 있어요.");
    commit(s=>{ (s.checkCats[viewerId]=s.checkCats[viewerId]||[]).push(c); }); ckCat=c; ckCatSheet(); return; }
  if(ev.target.id!=="ckForm") return; ev.preventDefault();
  const text=$("#ckInput").value.trim(); if(!text) return; const cat=ckCat==="all"?null:ckCat;
  commit(s=>{(s.checklists[viewerId]=s.checklists[viewerId]||[]).push({id:uid(),text,done:false,ts:Date.now(),...(cat?{cat}:{})});});
  $("#ckInput")?.focus();
});
// 1분마다 남은 기한·펫 상태를 새로 그려요 (시트·게임·연출이 열려 있거나 입력 중이면 건너뜀)
function quietRefresh(){ if(!state||!loaded||document.hidden) return; if(typeof game!=="undefined"&&game) return;
  if($("#modalSlot")?.innerHTML||$("#gameSlot")?.innerHTML||$(".fxo")||$(".gx")||$("#saveBar")) return;
  if(tab==="pet"&&selPet) return;
  const ae=document.activeElement; if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  const y=window.scrollY; render(); window.scrollTo(0,y); }
setInterval(quietRefresh,60000);
setInterval(()=>{ try{ if(state&&loaded&&state.titles.some(t=>t.cond?.type==="time")) checkTitleConds(); if(state&&loaded&&(state.events||[]).some(e=>e.trigger==="time")) evCondCheck(); }catch(e){} },20000);
document.addEventListener("visibilitychange",()=>{ document.documentElement.classList.toggle("paused",document.hidden); if(!document.hidden) setTimeout(quietRefresh,300); });
window.addEventListener("offline",()=>showNetBar());
window.addEventListener("online",()=>{ hideNetBar(); if(netFail){ loaded=false; render(); init(); } else if(pend.length) flush(); });
if(!navigator.onLine) showNetBar();
// 앱 안의 링크가 바깥 브라우저로 나가지 않게: 다른 주소로 가는 <a>는 막아요 (현재 외부 링크는 없지만 안전장치)
document.addEventListener("click",ev=>{ const a=ev.target.closest("a[href]"); if(!a||a.dataset.ext) return; let u; try{ u=new URL(a.getAttribute("href"),location.href); }catch(e){ return; } if(u.origin!==location.origin){ ev.preventDefault(); } },true);
document.addEventListener("keydown",ev=>{ if(ev.key!=="Escape") return; const fb=$(".fxo .btn"); if(fb){ fb.click(); return; } if($(".gx.t-done")){ acts.gxClose(); return; } if($("#modalSlot").innerHTML) closeSheet(); });
init();
})();
</script>
</body>
</html>
